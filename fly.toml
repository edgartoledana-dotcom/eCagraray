app = "ecagraray-app"

# Optional: set a primary region if you prefer
# primary_region = "iad"

kill_signal = "SIGINT"
kill_timeout = 5

[env]
  PORT = "4173"

[[services]]
  internal_port = 4173
  protocol = "tcp"

  [services.concurrency]
    type = "connections"
    hard_limit = 25

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls"]
    port = 443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    restart_limit = 6
