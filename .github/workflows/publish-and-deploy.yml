name: Deploy to Fly.io (Permanent)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy e-Cagraray
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app (first run only)
        run: flyctl apps create ecagraray-app || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create data volume (first run only)
        run: flyctl volumes create ecagraray_data --region sin --size 1 -a ecagraray-app -y || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config fly.toml -a ecagraray-app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
