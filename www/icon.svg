<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background base for PWA masking -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <!-- Tech glowing circuit ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="16 8" />
  <!-- Shield outline -->
  <path d="M256,96 C320,96 384,120 384,192 C384,320 256,416 256,416 C256,416 128,320 128,192 C128,120 192,96 256,96 Z" fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="6" />
  <!-- Inner cyber nodes -->
  <path d="M256,128 L256,384 M160,192 L352,192 M192,272 L320,272" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" stroke-linecap="round" />
  <circle cx="256" cy="192" r="16" fill="#ffffff" />
</svg>
